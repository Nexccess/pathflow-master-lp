name: 11B Browser E2E

on:
  pull_request:
    branches: [main]
    paths:
      - 'pages/reception.html'
      - 'api/reception-config.js'
      - 'api/reception-flow.js'
      - 'data/reception-stores.json'
      - 'vercel.json'
      - 'scripts/e2e_11b_browser.mjs'
      - 'scripts/serve_11b_e2e.mjs'
      - '.github/workflows/11b-live-browser-e2e.yml'
  workflow_dispatch:

jobs:
  browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start 11B E2E harness
        run: |
          node scripts/serve_11b_e2e.mjs > /tmp/11b-e2e-server.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3000/api/reception-config?storeId=9 >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/11b-e2e-server.log
          exit 1
      - name: Run desktop and mobile E2E
        env:
          PATHFLOW_PREVIEW_URL: http://127.0.0.1:3000
        run: node scripts/e2e_11b_browser.mjs
