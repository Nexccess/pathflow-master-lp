name: Production Tracking Probe

on:
  push:
    branches:
      - production-tracking-probe
    paths:
      - '.github/workflows/production-tracking-probe.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe production tracking persistence
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          response_file=$(mktemp)
          status=$(curl --silent --show-error --output "$response_file" --write-out '%{http_code}' \
            --request POST 'https://pathflow-master-lp.vercel.app/api/track' \
            --header 'Content-Type: application/json' \
            --data "{\"event\":\"reception_open\",\"storeId\":\"9\",\"path\":\"/p/9/reception\",\"message\":\"sales_ready_production_probe_${RUN_ID}\",\"source\":\"github-actions\",\"probe_run_id\":\"${RUN_ID}\"}")
          body=$(cat "$response_file")
          echo "HTTP_STATUS=$status"
          echo "BODY=$body"
          test "$status" = "200"
          python - "$body" <<'PY'
          import json, sys
          data = json.loads(sys.argv[1])
          if data.get('persisted') is not True:
              raise SystemExit(f"Tracking persistence not confirmed: {data}")
          print('PRODUCTION_TRACKING_CONFIRMED')
          PY
